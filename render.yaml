# Blueprint Render du site public (site statique). Voir la spec 0001, section « Hébergement sur Render ».
# Domaine : nollli.com (www redirige). Branchement DNS : spec 0001, section « Branchement du domaine ».
# À contrôler au premier déploiement : /cgu sert bien cgu.html (sinon ajouter une réécriture par page
# dans routes), la page 404 répond avec le code 404, et Strict-Transport-Security n'est pas en double.
services:
  - type: web
    name: noli-site
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Astro demande Node 22.12 ou plus.
      - key: NODE_VERSION
        value: '22.14.0'
    # Pas de réécriture vers index.html : ce n'est pas une SPA, chaque adresse a son fichier.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # Fichiers à nom unique produits par Astro : cache long. Les pages HTML gardent le cache par défaut.
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
